_core:
  default_config_hash: PsC0t-Finat8kp-rTiTCSTO-O1GTV7e-H-QdrBKFhU8
preset: none
ai_provider: anthropic
ai_model: claude-sonnet-4-6
ai_expansion_model: ''
ai_base_url: ''
ai_expand_query: true
ai_summarize: true
ai_languages:
  - en
max_follow_ups: 3
site_name: 'Meridian AI'
site_description: 'Meridian Institute of Artificial Intelligence — 250+ pages of AI educational content including degree programs in LLM engineering, computer vision, reinforcement learning, AI ethics, mathematical foundations, and applied AI; individual course syllabi; faculty research profiles; resource articles covering transformers, diffusion models, RL, alignment, MLOps, and AI-powered search; lecture pages with code examples; and research project descriptions. Content ranges from introductory explainers to graduate-level technical material.'
sortable_fields:
  - credits
  - date
sortable_field_descriptions:
  credits: 'Number of academic credits for the course (typically 1-6)'
  date: 'Course or program publication date'
filter_fields:
  - topic
  - difficulty
  - course_level
  - school
  - format
filter_field_descriptions:
  topic: "AI subject area. Map the user's query to one of these values: Transformers (attention mechanism, self-attention, encoder-decoder, BERT, GPT architecture), Reinforcement Learning (RL, reward, policy gradient, Q-learning, RLHF, agents), Computer Vision (image recognition, object detection, CNNs, image segmentation, diffusion models), Natural Language Processing (NLP, text, sentiment, translation, tokenization), Ethics & Governance (bias, fairness, alignment, responsible AI, regulation), Robotics (control systems, motion planning, manipulation), Generative AI (GANs, VAEs, diffusion, image generation, text generation), Search & Information Retrieval (ranking, embeddings, RAG, vector search), MLOps & Infrastructure (deployment, monitoring, pipelines, serving), Mathematics & Foundations (linear algebra, calculus, probability, optimization), Multimodal AI (vision-language, CLIP, image-text), Edge AI (mobile, embedded, optimization, quantization), AI History (Turing, perceptron, AI winter, deep learning revolution), Large Language Models (LLMs, GPT, Claude, scaling laws, fine-tuning), AI Safety & Alignment (alignment, safety, interpretability, red-teaming), AI Agents (autonomous agents, tool use, planning, multi-agent)"
  difficulty: 'Content difficulty level. Values: Introductory (no prerequisites, first exposure), Intermediate (requires foundational knowledge), Advanced (significant background required), Expert (research-level, cutting edge)'
  course_level: 'Academic course level. Values: Introductory (100-level), Intermediate (200-level), Advanced (300-level), Graduate (400-level), Seminar (500-level)'
  school: 'Department or school. Values: School of Language & Reasoning, School of Perception & Synthesis, School of Decision & Control, School of Foundations & Mathematics, School of Society & Governance, School of Applied Intelligence'
  format: 'Program delivery format (e.g. Online, Hybrid, In-person, Self-paced). Use when the user asks about a specific format.'
scoring:
  title_match_boost: 2.5
  title_all_terms_multiplier: 1.4
  content_match_boost: 0.6
  recency_boost_max: 0.1
  recency_half_life_days: 1825
  recency_penalty_after_days: 18250
  recency_max_penalty: 0.05
  expand_primary_weight: 0.75
  language: en
  custom_stop_words: {  }
  recency_strategy: exponential
  recency_curve: {  }
display:
  excerpt_length: 400
  results_per_page: 12
  max_pagefind_results: 60
  ai_summary_top_n: 10
  ai_summary_max_chars: 4000
cache_ttl: 2592000
prompt_expand_query: ''
prompt_summarize: ''
prompt_follow_up: ''
indexer: php
memory_budget:
  profile: conservative
  custom_bytes: null
  chunk_size: null
pagefind:
  build_dir: 'private://scolta-build'
  output_dir: 'public://scolta-pagefind'
  binary: pagefind
  auto_rebuild: true
  view_mode: search_index
