global:
  version: 1.x
  css:
    base:
      'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:wght@400;600;700&display=swap': { type: external }
    theme:
      css/meridian.css: {}
  js:
    js/meridian.js: {}
  dependencies:
    - core/drupal

# Rich Scolta result cards plus the themed search-as-you-type dropdown.
# Attached alongside the Scolta search block by meridian_scolta_block_view_alter().
#
# Deliberately NOT header JS. scolta.js defines window.Scolta when it executes
# and Drupal's scolta bridge behavior calls Scolta.init() on DOMContentLoaded;
# a header script would run before the first and silently no-op. The
# scolta/search dependency orders this file after the bundle, and the footer
# places it before init() runs — the window the renderers have to register in.
scolta-rich-results:
  version: 1.x
  css:
    theme:
      css/scolta-rich-results.css: {}
  js:
    js/scolta-rich-results.js: {}
  dependencies:
    - scolta/search
